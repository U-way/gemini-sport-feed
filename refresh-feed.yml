name: Refresh Gemini Sport XML

on:
  workflow_dispatch:
  schedule:
    # Every 4 hours; minutes offset from the top of the hour to reduce queue delays.
    - cron: "23 1,5,9,13,17,21 * * *"

permissions:
  contents: write

jobs:
  refresh-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Filter supplier XML
        run: python filter_feed.py

      - name: Publish updated XML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gemini-sport-ru.xml
          if git diff --cached --quiet; then
            echo "Feed has no changes."
          else
            git commit -m "Refresh Gemini Sport XML feed"
            git push
          fi
